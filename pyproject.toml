[project]
name = "pretix-vrpayment-wero"
dynamic = ["version"]
description = "Accept WERO payments through VR Payment, the payment service provider of Volksbanken Raiffeisenbanken."
readme = "README.rst"
license = {text = "pretix Enterprise"}
keywords = ["pretix"]
authors = [
    {name = "pretix Team", email = "support@pretix.eu"},
]
maintainers = [
    {name = "pretix Team", email = "support@pretix.eu"},
]

dependencies = [
]

[project.entry-points."pretix.plugin"]
pretix_vrpayment_wero = "pretix_vrpayment_wero:PretixPluginMeta"

[project.entry-points."distutils.commands"]
build = "pretix_plugin_build.build:CustomBuild"

[build-system]
requires = [
    "setuptools",
    "pretix-plugin-build",
]

[project.urls]
homepage = "https://code.rami.io/pretix/pretix-vrpayment-wero/"
repository = "https://code.rami.io/pretix/pretix-vrpayment-wero/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_vrpayment_wero.__version__"}

[tool.setuptools.packages.find]
include = ["pretix*"]
namespaces = false
